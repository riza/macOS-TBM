[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "macOS-TBM"
dynamic = ["version"]
description = "Read-only attack-surface research for every launchd service on a Mac."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rıza Sabuncu" }]
keywords = [
  "macos",
  "security",
  "launchd",
  "xpc",
  "mach-o",
  "attack-surface",
  "reverse-engineering",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
ui = ["rich>=13.7", "tqdm>=4.66", "textual>=0.50"]
deep = ["r2pipe>=1.9.4"]
dev = ["ruff>=0.9", "mypy>=1.11", "coverage>=7.6"]

[project.urls]
Homepage = "https://github.com/riza/macOS-TBM"
Source = "https://github.com/riza/macOS-TBM"
Issues = "https://github.com/riza/macOS-TBM/issues"

[project.scripts]
tbm = "tbm:main"

[tool.setuptools]
py-modules = ["app_info", "deputy_all", "entowners", "hunt", "scanner", "tbm", "ui", "xref"]

[tool.setuptools.dynamic]
version = { attr = "app_info.VERSION" }

[tool.setuptools.packages.find]
include = [
  "analyzers*",
  "backends*",
  "collectors*",
  "graph*",
  "models*",
  "reporting*",
  "utils*",
  "rules*",
]

[tool.setuptools.package-data]
rules = ["*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["re", "results", "results-*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
allow_redefinition = true
disable_error_code = ["func-returns-value", "return-value"]
files = [
  "analyzers",
  "collectors",
  "graph",
  "models",
  "reporting",
  "utils",
  "app_info.py",
  "entowners.py",
]

[tool.coverage.run]
branch = true
source = [
  "analyzers",
  "backends",
  "collectors",
  "graph",
  "models",
  "reporting",
  "utils",
  "rules",
  "app_info",
  "deputy_all",
  "entowners",
  "hunt",
  "scanner",
  "tbm",
  "ui",
  "xref",
]
omit = [".venv-deep/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

